name: Publish

on:
  push:
    tags:
      # Digits only, so stray tags like "vX.Y.Z" cannot start a release.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "Releasing ${pkg_version}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs after the build: the scan checks the compiled dist/ as well as the sources.
      - name: Scan community package rules
        run: npm run lint:scan

      - name: Publish n8n-nodes-leadtable
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'

      - name: Publish @rjsebening/n8n-nodes-leadtable
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"

          cp -R dist "${publish_dir}/dist"
          cp README.md LICENSE package.json "${publish_dir}/"

          npm pkg set --prefix "${publish_dir}" name="@rjsebening/n8n-nodes-leadtable"
          npm publish "${publish_dir}" --provenance --access public --ignore-scripts
        env:
          RELEASE_MODE: 'true'
